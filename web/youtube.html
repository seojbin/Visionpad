
<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>YouTube Viewer</title>

    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .container {
            max-width: 1250px;
            margin: 0 auto;
        }

        h1 {
            margin-top: 0;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        #query-input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 10px 16px;
            font-size: 15px;
            cursor: pointer;
        }

        .main-grid {
            display: grid;
            grid-template-columns:
                minmax(0, 2fr)
                minmax(300px, 1fr);
            gap: 20px;
            align-items: start;
        }

        .panel {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 16px;
        }

        #youtube-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: black;
            overflow: hidden;
            position: relative;
        }

        #youtube-player {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #youtube-player iframe {
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .viewer-title {
            margin-top: 0;
        }

        .dot-wrapper {
            width: 100%;
            background: black;
            border: 1px solid #777;
        }

        #dot-image {
            display: block;
            width: 100%;
            aspect-ratio: 60 / 40;
            object-fit: contain;
            image-rendering: pixelated;
        }

        #ocr-text {
            min-height: 48px;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #aaa;
            background: #fafafa;
            font-size: 22px;
            font-weight: bold;
            word-break: break-all;
        }

        #status {
            margin: 12px 0;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
        }

        #debug {
            margin-top: 12px;
            padding: 10px;
            background: #fafafa;
            border: 1px solid #ddd;
            font-family: monospace;
            white-space: pre-line;
            line-height: 1.5;
        }

        #search-results {
            margin-top: 12px;
            margin-bottom: 12px;
        }

        .search-result {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .search-result:hover {
            background: #eee;
        }

        .search-result img {
            width: 120px;
            height: 68px;
            object-fit: cover;
        }

        .search-result-title {
            font-weight: bold;
        }

        #capture-video,
        #capture-canvas {
            display: none;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>VideoBraille YouTube Viewer</h1>

    <div class="search-box">

        <input
            id="query-input"
            type="text"
            placeholder="YouTube 주소 또는 검색어"
            autocomplete="off"
        >

        <button id="load-button">
            불러오기
        </button>

    </div>

    <div id="search-results"></div>

    <div id="status">
        YouTube API 준비 중
    </div>

    <div class="main-grid">

        <div class="panel">

            <h2>영상</h2>

            <div id="youtube-wrapper">
                <div id="youtube-player"></div>
            </div>

            <div class="controls">

                <button id="play-button">
                    재생
                </button>

                <button id="pause-button">
                    일시정지
                </button>

                <button id="start-capture-button">
                    분석 시작
                </button>

                <button id="stop-capture-button">
                    분석 중지
                </button>

            </div>

            <div id="debug">
Video Time: 0.00
Scene: -
HSV Similarity: -
Pixel Difference: -
OCR Time: -
Capture: -
            </div>

        </div>

        <div class="panel">

            <h2 class="viewer-title">
                Dot Viewer
            </h2>

            <div class="dot-wrapper">

                <img
                    id="dot-image"
                    alt="Dot 변환 결과"
                >

            </div>

            <h2>
                OCR
            </h2>

            <div id="ocr-text">
                인식된 글자 없음
            </div>

        </div>

    </div>

</div>

<video
    id="capture-video"
    autoplay
    muted
    playsinline
></video>

<canvas
    id="capture-canvas"
></canvas>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;
let youtubeReady = false;
let currentVideoId = null;

let captureStream = null;
let captureReady = false;

let sceneTimer = null;
let ocrTimer = null;

let sceneRequestBusy = false;
let ocrRequestBusy = false;

let regionCropActive = false;

let audioOutputWindow = null;
let audioTrack = null;

let syncAnchorVideoTime = null;
let syncAnchorAudioTime = null;

const accessibleOutputTimers =
    new Set();

let captureConfig = {
    scene_interval_sec: 0.3,
    ocr_interval_sec: 0.8,
    send_width: 640,
    send_height: 360,
    jpeg_quality: 0.8,
    access_delay_sec: 10.0
};

let debugState = {
    videoTime: 0,
    sceneId: "-",
    similarity: "-",
    pixelDifference: "-",
    ocrTime: "-",
    captureMode: "-",
    audioStatus: "-"
};


const queryInput =
    document.getElementById(
        "query-input"
    );

const loadButton =
    document.getElementById(
        "load-button"
    );

const playButton =
    document.getElementById(
        "play-button"
    );

const pauseButton =
    document.getElementById(
        "pause-button"
    );

const startCaptureButton =
    document.getElementById(
        "start-capture-button"
    );

const stopCaptureButton =
    document.getElementById(
        "stop-capture-button"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const searchResultsElement =
    document.getElementById(
        "search-results"
    );

const dotImage =
    document.getElementById(
        "dot-image"
    );

const ocrText =
    document.getElementById(
        "ocr-text"
    );

const debugElement =
    document.getElementById(
        "debug"
    );

const captureVideo =
    document.getElementById(
        "capture-video"
    );

const captureCanvas =
    document.getElementById(
        "capture-canvas"
    );

const captureContext =
    captureCanvas.getContext(
        "2d"
    );


function setStatus(text) {
    statusElement.textContent =
        text;
}


function renderDebug() {

    debugElement.textContent =
        "Video Time: "
        + Number(
            debugState.videoTime
        ).toFixed(2)

        + "\nScene: "
        + debugState.sceneId

        + "\nHSV Similarity: "
        + debugState.similarity

        + "\nPixel Difference: "
        + debugState.pixelDifference

        + "\nOCR Time: "
        + debugState.ocrTime

        + "\nCapture: "
        + debugState.captureMode

        + "\nAudio: "
        + debugState.audioStatus

        + "\nAccess Delay: "
        + Number(
            captureConfig.access_delay_sec
        ).toFixed(1)
        + "s";
}


function clearViewer() {

    dotImage.removeAttribute(
        "src"
    );

    ocrText.textContent =
        "인식된 글자 없음";

    debugState = {
        videoTime: 0,
        sceneId: "-",
        similarity: "-",
        pixelDifference: "-",
        ocrTime: "-",
        captureMode:
            regionCropActive
                ? "Region"
                : (
                    captureReady
                        ? "Manual"
                        : "-"
                ),
        audioStatus:
            getAudioOutputStatus()
    };

    renderDebug();
}


async function loadClientConfig() {

    try {

        const response =
            await fetch(
                "/api/config"
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        captureConfig = {
            ...captureConfig,
            ...data
        };

        console.log(
            "Capture config",
            captureConfig
        );

    } catch (error) {

        console.error(
            "Config load failed",
            error
        );
    }
}


window.onYouTubeIframeAPIReady =
    function () {

        player = new YT.Player(
            "youtube-player",
            {
                width: "100%",
                height: "100%",

                playerVars: {
                controls: 0,
                disablekb: 1,
                fs: 0,
                iv_load_policy: 3,
                rel: 0,
                playsinline: 1
                },

                events: {

                    onReady: function () {

                        youtubeReady = true;

                        player.mute();

                        setStatus(
                            "YouTube 준비 완료"
                        );
                    },

                    onStateChange:
                        function () {
                        },

                    onError:
                        function (event) {

                            setStatus(
                                "YouTube 재생 오류: "
                                + event.data
                            );
                        }
                }
            }
        );
    };


async function resolveYouTube() {

    const query =
        queryInput.value.trim();

    if (!query) {

        setStatus(
            "YouTube 주소 또는 검색어를 입력하세요"
        );

        return;
    }

    setStatus(
        "영상 확인 중"
    );

    searchResultsElement.innerHTML =
        "";

    try {

        const response =
            await fetch(
                "/api/youtube/resolve",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        query: query
                    })
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail
                || "YouTube 요청 실패"
            );
        }

        if (
            data.mode === "url"
            && data.results
            && data.results.length > 0
        ) {

            await loadVideo(
                data.results[0].video_id
            );

            return;
        }

        if (
            data.mode === "search"
        ) {

            showSearchResults(
                data.results || []
            );

            setStatus(
                `${(data.results || []).length}개 검색 결과`
            );

            return;
        }

        throw new Error(
            "알 수 없는 YouTube 응답입니다"
        );

    } catch (error) {

        setStatus(
            error.message
        );
    }
}


function showSearchResults(results) {

    searchResultsElement.innerHTML =
        "";

    if (
        !results
        || results.length === 0
    ) {

        searchResultsElement.textContent =
            "검색 결과가 없습니다";

        return;
    }

    for (const item of results) {

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "search-result";


        if (item.thumbnail) {

            const image =
                document.createElement(
                    "img"
                );

            image.src =
                item.thumbnail;

            image.alt =
                item.title || "";

            row.appendChild(
                image
            );
        }


        const textArea =
            document.createElement(
                "div"
            );


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "search-result-title";

        title.textContent =
            item.title
            || item.video_id;


        const channel =
            document.createElement(
                "div"
            );

        channel.textContent =
            item.channel_title
            || "";


        textArea.appendChild(
            title
        );

        textArea.appendChild(
            channel
        );

        row.appendChild(
            textArea
        );


        row.addEventListener(
            "click",
            async function () {

                await loadVideo(
                    item.video_id
                );

                searchResultsElement.innerHTML =
                    "";
            }
        );


        searchResultsElement.appendChild(
            row
        );
    }
}



function clearAccessibleOutputTimers() {

    for (
        const timer
        of accessibleOutputTimers
    ) {
        clearTimeout(
            timer
        );
    }

    accessibleOutputTimers.clear();
}


function scheduleAccessibleOutput(
    sourceTimestamp,
    callback
) {

    const delaySec =
        Number(
            captureConfig.access_delay_sec
        ) || 0;

    let remainingSec;

    const audioNow =
        getAudioOutputCurrentTime();

    if (
        audioNow !== null
        && syncAnchorVideoTime !== null
        && syncAnchorAudioTime !== null
    ) {

        const targetAudioTime =
            syncAnchorAudioTime
            + (
                Number(sourceTimestamp)
                - syncAnchorVideoTime
            )
            + delaySec;

        remainingSec =
            Math.max(
                0,
                targetAudioTime
                - audioNow
            );

    } else {

        const processingTime =
            getVideoTime();

        remainingSec =
            Math.max(
                0,
                Number(sourceTimestamp)
                + delaySec
                - processingTime
            );
    }

    const timer =
        setTimeout(
            function () {

                accessibleOutputTimers.delete(
                    timer
                );

                callback();

            },
            remainingSec * 1000
        );

    accessibleOutputTimers.add(
        timer
    );
}


async function stopDelayedAudio() {

    syncAnchorVideoTime = null;
    syncAnchorAudioTime = null;
    audioTrack = null;

    if (
        audioOutputWindow
        && !audioOutputWindow.closed
    ) {

        try {
            await audioOutputWindow
                .stopDelayedAudio();
        } catch (_) {
        }

        try {
            audioOutputWindow.close();
        } catch (_) {
        }
    }

    audioOutputWindow = null;
}


function getAudioOutputCurrentTime() {

    if (
        !audioOutputWindow
        || audioOutputWindow.closed
    ) {
        return null;
    }

    try {
        const value =
            audioOutputWindow
                .getAudioCurrentTime();

        return Number.isFinite(value)
            ? value
            : null;

    } catch (_) {
        return null;
    }
}


function getAudioOutputStatus() {

    if (
        !audioOutputWindow
        || audioOutputWindow.closed
    ) {
        return "-";
    }

    try {
        return audioOutputWindow
            .getAudioStatus();
    } catch (_) {
        return "popup 연결 중";
    }
}


async function openAudioOutputWindow() {

    audioOutputWindow =
        window.open(
            "/static/audio_output.html",
            "VideoBrailleAudioOutput",
            "width=380,height=230"
        );

    if (!audioOutputWindow) {
        throw new Error(
            "오디오 출력 창이 차단되었습니다. 팝업을 허용해주세요."
        );
    }

    const started =
        performance.now();

    while (true) {

        try {
            if (
                audioOutputWindow
                .audioOutputReady
            ) {
                return;
            }
        } catch (_) {
        }

        if (
            performance.now()
            - started
            > 5000
        ) {
            throw new Error(
                "오디오 출력 창 준비 시간이 초과되었습니다."
            );
        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );
    }
}


async function startDelayedAudio(
    stream
) {

    const audioTracks =
        stream.getAudioTracks();

    if (
        !audioTracks
        || audioTracks.length === 0
    ) {
        throw new Error(
            "탭 오디오가 공유되지 않았습니다. "
            + "화면 공유 창에서 탭 오디오 공유를 켜주세요."
        );
    }

    if (
        !audioOutputWindow
        || audioOutputWindow.closed
    ) {
        throw new Error(
            "오디오 출력 창이 닫혀 있습니다."
        );
    }

    audioTrack =
        audioTracks[0];

    const supportedConstraints =
        navigator.mediaDevices
            .getSupportedConstraints();

    const constraints = {};

    if (supportedConstraints.restrictOwnAudio) {
        constraints.restrictOwnAudio = false;
    }

    if (supportedConstraints.suppressLocalAudioPlayback) {
        constraints.suppressLocalAudioPlayback = true;
    }

    if (Object.keys(constraints).length > 0) {
        try {
            await audioTrack.applyConstraints(
                constraints
            );
        } catch (error) {
            console.warn(
                "Audio constraints apply failed",
                error
            );
        }
    }

    const delaySec =
        Number(
            captureConfig.access_delay_sec
        ) || 0;

    const result =
        await audioOutputWindow
            .startDelayedAudio(
                stream,
                delaySec
            );

    debugState.audioStatus =
        result.status;

    renderDebug();

    console.log(
        "Delayed audio popup started",
        result
    );

    return result;
}


async function loadVideo(videoId) {

    if (!youtubeReady) {

        setStatus(
            "YouTube API가 아직 준비되지 않았습니다"
        );

        return;
    }

    if (!videoId) {

        setStatus(
            "올바른 video ID가 없습니다"
        );

        return;
    }


    clearAccessibleOutputTimers();

    await resetProcessor();

    currentVideoId =
        videoId;

    clearViewer();

    searchResultsElement.innerHTML =
        "";


    try {

        player.loadVideoById({
            videoId:
                videoId,

            startSeconds:
                0
        });


        if (
            captureReady
            && captureStream
        ) {

            await startDelayedAudio(
                captureStream
            );

            player.unMute();
            player.setVolume(
                100
            );

        } else {

            player.mute();
        }


        setStatus(
            captureReady
                ? "새 영상 로드 완료, 지연 분석 계속 진행 중"
                : "새 영상 로드 완료"
        );

    } catch (error) {

        setStatus(
            "영상 로드 실패: "
            + error.message
        );
    }
}


async function resetProcessor() {

    try {

        const response =
            await fetch(
                "/api/reset",
                {
                    method: "POST"
                }
            );

        if (!response.ok) {

            const data =
                await response.json();

            throw new Error(
                data.detail
                || "Processor reset 실패"
            );
        }

    } catch (error) {

        console.error(
            "Processor reset failed",
            error
        );
    }
}


async function waitForCaptureVideo() {

    const started =
        performance.now();

    while (
        captureVideo.videoWidth <= 0
        || captureVideo.videoHeight <= 0
    ) {

        if (
            performance.now()
            - started
            > 5000
        ) {

            throw new Error(
                "화면 캡처 영상 크기를 확인할 수 없습니다"
            );
        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    50
                )
        );
    }
}


async function tryEnableRegionCapture(
    videoTrack
) {

    regionCropActive =
        false;

    try {

        if (
            typeof CropTarget === "undefined"
            || typeof videoTrack.cropTo
            !== "function"
        ) {

            console.log(
                "Region Capture 미지원"
            );

            return false;
        }


        const wrapper =
            document.getElementById(
                "youtube-wrapper"
            );


        const cropTarget =
            await CropTarget.fromElement(
                wrapper
            );


        await videoTrack.cropTo(
            cropTarget
        );


        regionCropActive =
            true;

        console.log(
            "Region Capture enabled"
        );

        return true;

    } catch (error) {

        console.warn(
            "Region Capture failed",
            error
        );

        regionCropActive =
            false;

        return false;
    }
}


async function startCapture() {

    if (!currentVideoId) {

        setStatus(
            "먼저 영상을 불러오세요"
        );

        return;
    }


    if (
        !navigator.mediaDevices
        || !navigator.mediaDevices
            .getDisplayMedia
    ) {

        setStatus(
            "이 브라우저는 화면 캡처를 지원하지 않습니다"
        );

        return;
    }


    stopCapture();

    player.pauseVideo();

    setStatus(
        "현재 VideoBraille 브라우저 탭을 선택하고 탭 오디오 공유를 켜주세요"
    );


    try {

        await openAudioOutputWindow();

        const supportedConstraints =
            navigator.mediaDevices
                .getSupportedConstraints();


        const audioOption = {};


        if (
            supportedConstraints
                .suppressLocalAudioPlayback
        ) {

            audioOption
                .suppressLocalAudioPlayback =
                true;
        }


        if (
            supportedConstraints
                .restrictOwnAudio
        ) {

            audioOption
                .restrictOwnAudio =
                false;
        }


        captureStream =
            await navigator.mediaDevices
                .getDisplayMedia({
                    video: {
                        displaySurface:
                            "browser"
                    },

                    audio:
                        audioOption,

                    preferCurrentTab:
                        true,

                    selfBrowserSurface:
                        "include",

                    systemAudio:
                        "include",

                    surfaceSwitching:
                        "include"
                });


        const videoTrack =
            captureStream
                .getVideoTracks()[0];


        if (!videoTrack) {

            throw new Error(
                "영상 캡처 스트림이 없습니다"
            );
        }


        const settings =
            videoTrack.getSettings();


        if (
            settings.displaySurface
            && settings.displaySurface
            !== "browser"
        ) {

            throw new Error(
                "브라우저 탭 공유를 선택해주세요"
            );
        }


        await tryEnableRegionCapture(
            videoTrack
        );


        captureVideo.srcObject =
            captureStream;


        await captureVideo.play();

        await waitForCaptureVideo();


        captureReady =
            true;


        debugState.captureMode =
            regionCropActive
                ? "Region"
                : "Manual";

        renderDebug();


        videoTrack.addEventListener(
            "ended",
            function () {

                stopCapture();

                setStatus(
                    "화면 공유가 종료되었습니다"
                );
            }
        );


        await resetProcessor();

        clearAccessibleOutputTimers();

        clearViewer();


        player.seekTo(
            0,
            true
        );

        player.unMute();

        player.setVolume(
            100
        );


        const sceneIntervalMs =
            Math.max(
                100,
                Number(
                    captureConfig
                        .scene_interval_sec
                ) * 1000
            );


        const ocrIntervalMs =
            Math.max(
                300,
                Number(
                    captureConfig
                        .ocr_interval_sec
                ) * 1000
            );


        sceneTimer =
            setInterval(
                sendSceneFrame,
                sceneIntervalMs
            );


        ocrTimer =
            setInterval(
                sendOcrFrame,
                ocrIntervalMs
            );


        player.playVideo();


        const audioStart =
            await startDelayedAudio(
                captureStream
            );


        syncAnchorVideoTime =
            getVideoTime();

        syncAnchorAudioTime =
            Number(
                audioStart.currentTime
            );


        setTimeout(
            function () {

                sendSceneFrame();
                sendOcrFrame();

            },
            300
        );


        const delaySec =
            Number(
                captureConfig.access_delay_sec
            ) || 0;


        setStatus(
            regionCropActive
                ? "분석 중, YouTube 영역 직접 캡처, 오디오 "
                    + delaySec
                    + "초 지연"
                : "분석 중, 수동 영역 계산, 오디오 "
                    + delaySec
                    + "초 지연"
        );

    } catch (error) {

        stopCapture();

        setStatus(
            "화면 캡처 실패: "
            + error.message
        );
    }
}


function stopCapture() {

    captureReady =
        false;


    clearAccessibleOutputTimers();


    if (sceneTimer) {

        clearInterval(
            sceneTimer
        );

        sceneTimer =
            null;
    }


    if (ocrTimer) {

        clearInterval(
            ocrTimer
        );

        ocrTimer =
            null;
    }


    sceneRequestBusy =
        false;

    ocrRequestBusy =
        false;

    regionCropActive =
        false;


    stopDelayedAudio();


    if (captureStream) {

        for (
            const track
            of captureStream.getTracks()
        ) {

            track.stop();
        }

        captureStream =
            null;
    }


    captureVideo.srcObject =
        null;


    if (player) {

        try {
            player.mute();
        } catch (_) {
        }
    }


    debugState.captureMode =
        "-";

    debugState.audioStatus =
        "-";

    renderDebug();
}


function captureCurrentFrame() {

    if (
        !captureReady
        || !captureStream
        || captureVideo.videoWidth <= 0
        || captureVideo.videoHeight <= 0
    ) {

        return null;
    }


    const targetWidth =
        Number(
            captureConfig.send_width
        ) || 640;

    const targetHeight =
        Number(
            captureConfig.send_height
        ) || 360;


    captureCanvas.width =
        targetWidth;

    captureCanvas.height =
        targetHeight;


    if (regionCropActive) {

        captureContext.drawImage(
            captureVideo,

            0,
            0,
            captureVideo.videoWidth,
            captureVideo.videoHeight,

            0,
            0,
            targetWidth,
            targetHeight
        );

    } else {

        const wrapper =
            document.getElementById(
                "youtube-wrapper"
            );


        const rect =
            wrapper.getBoundingClientRect();


        const viewportWidth =
            document.documentElement
                .clientWidth;

        const viewportHeight =
            document.documentElement
                .clientHeight;


        if (
            viewportWidth <= 0
            || viewportHeight <= 0
        ) {

            return null;
        }


        const scaleX =
            captureVideo.videoWidth
            / viewportWidth;

        const scaleY =
            captureVideo.videoHeight
            / viewportHeight;


        let sourceX =
            rect.left
            * scaleX;

        let sourceY =
            rect.top
            * scaleY;

        let sourceWidth =
            rect.width
            * scaleX;

        let sourceHeight =
            rect.height
            * scaleY;


        sourceX =
            Math.max(
                0,
                sourceX
            );

        sourceY =
            Math.max(
                0,
                sourceY
            );


        sourceWidth =
            Math.min(
                sourceWidth,
                captureVideo.videoWidth
                - sourceX
            );


        sourceHeight =
            Math.min(
                sourceHeight,
                captureVideo.videoHeight
                - sourceY
            );


        if (
            sourceWidth <= 0
            || sourceHeight <= 0
        ) {

            return null;
        }


        captureContext.drawImage(
            captureVideo,

            sourceX,
            sourceY,
            sourceWidth,
            sourceHeight,

            0,
            0,
            targetWidth,
            targetHeight
        );
    }


    return captureCanvas.toDataURL(
        "image/jpeg",
        Number(
            captureConfig.jpeg_quality
        ) || 0.8
    );
}


function getVideoTime() {

    if (
        !player
        || typeof player
            .getCurrentTime
            !== "function"
    ) {

        return 0;
    }


    const time =
        Number(
            player.getCurrentTime()
        );


    if (
        Number.isNaN(
            time
        )
    ) {

        return 0;
    }


    return time;
}


async function sendSceneFrame() {

    if (
        !captureReady
        || sceneRequestBusy
        || !player
    ) {

        return;
    }


    const imageBase64 =
        captureCurrentFrame();


    if (!imageBase64) {
        return;
    }


    const timestamp =
        getVideoTime();


    sceneRequestBusy =
        true;


    try {

        const response =
            await fetch(
                "/api/scene-frame",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            image_base64:
                                imageBase64,

                            timestamp:
                                timestamp
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail
                || "Scene 처리 실패"
            );
        }


        if (
            data.scene_changed
            && data.dot_image
        ) {

            const dotData =
                data.dot_image;

            const sceneTimestamp =
                Number(
                    data.timestamp
                );


            scheduleAccessibleOutput(
                sceneTimestamp,

                function () {

                    dotImage.src =
                        dotData;
                }
            );
        }


        let similarity =
            "-";


        if (
            data.scene_similarity
            !== null
            && data.scene_similarity
            !== undefined
        ) {

            similarity =
                Number(
                    data.scene_similarity
                ).toFixed(3);
        }


        let pixelDifference =
            "-";


        if (
            data.pixel_difference
            !== null
            && data.pixel_difference
            !== undefined
        ) {

            pixelDifference =
                Number(
                    data.pixel_difference
                ).toFixed(2);
        }


        debugState.videoTime =
            timestamp;

        debugState.sceneId =
            data.scene_id;

        debugState.similarity =
            similarity;

        debugState.pixelDifference =
            pixelDifference;


        renderDebug();


        if (data.scene_changed) {

            console.log(
                "Scene changed",
                {
                    scene:
                        data.scene_id,

                    time:
                        timestamp,

                    similarity:
                        similarity,

                    difference:
                        pixelDifference
                }
            );
        }

    } catch (error) {

        console.error(
            "Scene processing error",
            error
        );

        setStatus(
            "Scene 분석 오류: "
            + error.message
        );

    } finally {

        sceneRequestBusy =
            false;
    }
}


async function sendOcrFrame() {

    if (
        !captureReady
        || ocrRequestBusy
        || !player
    ) {

        return;
    }


    const imageBase64 =
        captureCurrentFrame();


    if (!imageBase64) {
        return;
    }


    const timestamp =
        getVideoTime();


    ocrRequestBusy =
        true;


    try {

        const response =
            await fetch(
                "/api/ocr-frame",
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            image_base64:
                                imageBase64,

                            timestamp:
                                timestamp
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.detail
                || "OCR 처리 실패"
            );
        }


        if (
            data.ocr_updated
            && data.ocr_text
            && data.ocr_text.trim()
        ) {

            const textData =
                data.ocr_text;

            const ocrTimestamp =
                Number(
                    data.timestamp
                );


            scheduleAccessibleOutput(
                ocrTimestamp,

                function () {

                    ocrText.textContent =
                        textData;
                }
            );
        }


        debugState.ocrTime =
            Number(
                data.timestamp
            ).toFixed(2);

        debugState.videoTime =
            timestamp;


        renderDebug();


        if (data.ocr_updated) {

            console.log(
                "OCR updated",
                {
                    time:
                        timestamp,

                    text:
                        data.ocr_text
                }
            );
        }

    } catch (error) {

        console.error(
            "OCR processing error",
            error
        );

    } finally {

        ocrRequestBusy =
            false;
    }
}


loadButton.addEventListener(
    "click",
    resolveYouTube
);


queryInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            resolveYouTube();
        }
    }
);


playButton.addEventListener(
    "click",
    function () {

        if (!player) {
            return;
        }

        if (captureReady) {

            player.unMute();

            player.setVolume(
                100
            );

        } else {

            player.mute();
        }

        player.playVideo();
    }
);


pauseButton.addEventListener(
    "click",
    function () {

        if (!player) {
            return;
        }

        player.pauseVideo();
    }
);


startCaptureButton.addEventListener(
    "click",
    startCapture
);


stopCaptureButton.addEventListener(
    "click",
    function () {

        stopCapture();

        setStatus(
            "분석 중지"
        );
    }
);


window.addEventListener(
    "beforeunload",
    function () {

        stopCapture();
    }
);


loadClientConfig();
renderDebug();

</script>
