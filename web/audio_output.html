<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>VideoBraille Audio Output</title>

    <style>
        body {
            margin: 0;
            padding: 18px;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        h2 {
            margin-top: 0;
        }

        #status {
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            line-height: 1.5;
            white-space: pre-line;
        }

        button {
            margin-top: 12px;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h2>VideoBraille Audio Output</h2>

<div id="status">
오디오 출력 준비 중
</div>

<button id="resume-button">
    오디오 출력 활성화
</button>

<script>

let audioContext = null;
let audioSource = null;
let delayNode = null;
let gainNode = null;
let analyserNode = null;
let audioTrack = null;
let meterTimer = null;
let currentRms = 0;
let currentDelaySec = 0;

const statusElement =
    document.getElementById(
        "status"
    );

const resumeButton =
    document.getElementById(
        "resume-button"
    );

window.audioOutputReady = true;


function renderStatus() {

    const state =
        audioContext
            ? audioContext.state
            : "not-started";

    const trackState =
        audioTrack
            ? audioTrack.readyState
            : "-";

    const muted =
        audioTrack
            ? String(audioTrack.muted)
            : "-";

    statusElement.textContent =
        "AudioContext: "
        + state
        + "\nTrack: "
        + trackState
        + "\nTrack muted: "
        + muted
        + "\nDelay: "
        + Number(currentDelaySec).toFixed(1)
        + "s\nSignal RMS: "
        + currentRms.toFixed(4);
}


async function ensureAudioContext() {

    const AudioContextClass =
        window.AudioContext
        || window.webkitAudioContext;

    if (!AudioContextClass) {
        throw new Error(
            "Web Audio API를 지원하지 않습니다."
        );
    }

    if (!audioContext) {
        audioContext =
            new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
        try {
            await audioContext.resume();
        } catch (_) {
        }
    }

    renderStatus();
}


function startMeter() {

    if (meterTimer) {
        clearInterval(
            meterTimer
        );
    }

    if (!analyserNode) {
        return;
    }

    const buffer =
        new Float32Array(
            analyserNode.fftSize
        );

    meterTimer =
        setInterval(
            function () {

                analyserNode
                    .getFloatTimeDomainData(
                        buffer
                    );

                let sum = 0;

                for (
                    let i = 0;
                    i < buffer.length;
                    i++
                ) {
                    sum +=
                        buffer[i]
                        * buffer[i];
                }

                currentRms =
                    Math.sqrt(
                        sum / buffer.length
                    );

                renderStatus();

            },
            300
        );
}


window.startDelayedAudio =
    async function (
        stream,
        delaySec
    ) {

        await window.stopDelayedAudio();
        await ensureAudioContext();

        const tracks =
            stream.getAudioTracks();

        if (
            !tracks
            || tracks.length === 0
        ) {
            throw new Error(
                "오디오 트랙이 없습니다."
            );
        }

        audioTrack =
            tracks[0];

        currentDelaySec =
            Number(delaySec) || 0;

        const audioOnlyStream =
            new MediaStream(
                [audioTrack]
            );

        audioSource =
            audioContext
                .createMediaStreamSource(
                    audioOnlyStream
                );

        analyserNode =
            audioContext
                .createAnalyser();

        analyserNode.fftSize =
            2048;

        delayNode =
            audioContext.createDelay(
                Math.max(
                    30,
                    currentDelaySec + 5
                )
            );

        delayNode.delayTime
            .setValueAtTime(
                currentDelaySec,
                audioContext.currentTime
            );

        gainNode =
            audioContext.createGain();

        gainNode.gain
            .setValueAtTime(
                1.0,
                audioContext.currentTime
            );

        audioSource.connect(
            analyserNode
        );

        analyserNode.connect(
            delayNode
        );

        delayNode.connect(
            gainNode
        );

        gainNode.connect(
            audioContext.destination
        );

        startMeter();
        renderStatus();

        return {
            currentTime:
                audioContext.currentTime,

            status:
                window.getAudioStatus()
        };
    };


window.stopDelayedAudio =
    async function () {

        if (meterTimer) {
            clearInterval(
                meterTimer
            );

            meterTimer = null;
        }

        if (audioSource) {
            try {
                audioSource.disconnect();
            } catch (_) {
            }

            audioSource = null;
        }

        if (analyserNode) {
            try {
                analyserNode.disconnect();
            } catch (_) {
            }

            analyserNode = null;
        }

        if (delayNode) {
            try {
                delayNode.disconnect();
            } catch (_) {
            }

            delayNode = null;
        }

        if (gainNode) {
            try {
                gainNode.disconnect();
            } catch (_) {
            }

            gainNode = null;
        }

        audioTrack = null;
        currentRms = 0;

        renderStatus();
    };


window.getAudioCurrentTime =
    function () {

        if (!audioContext) {
            return NaN;
        }

        return audioContext.currentTime;
    };


window.getAudioStatus =
    function () {

        const state =
            audioContext
                ? audioContext.state
                : "not-started";

        const trackState =
            audioTrack
                ? audioTrack.readyState
                : "-";

        const muted =
            audioTrack
                ? audioTrack.muted
                : "-";

        return (
            state
            + " / track="
            + trackState
            + " / muted="
            + muted
            + " / rms="
            + currentRms.toFixed(4)
        );
    };


resumeButton.addEventListener(
    "click",
    async function () {

        try {
            await ensureAudioContext();
            renderStatus();
        } catch (error) {
            statusElement.textContent =
                error.message;
        }
    }
);


renderStatus();

</script>
</body>
</html>
